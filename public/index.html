<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Richest Country in the World</title>
<style>.cr1{}.cr2{filter:grayscale(1) brightness(1.35)}.cr3{filter:grayscale(1) sepia(1) hue-rotate(-18deg) saturate(3) brightness(.75)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#1a0b2e,#3b1d60);color:#fff;min-height:100vh}
.w{max-width:560px;margin:auto;padding:16px}h1{text-align:center;font-size:26px;margin:8px 0;background:linear-gradient(90deg,#ffd700,#ffb347);-webkit-background-clip:text;color:transparent}
.card{background:#ffffff14;border-radius:16px;padding:14px;margin:12px 0}input,select,button{width:100%;padding:12px;border-radius:10px;border:0;font-size:16px;margin:4px 0}
button{background:linear-gradient(90deg,#ffd700,#ff9a00);font-weight:700;cursor:pointer}.demo{background:#ff4d6d;text-align:center;padding:6px;border-radius:8px;font-size:13px}
.pod{display:flex;align-items:flex-end;gap:8px;text-align:center}.pod div{flex:1;background:#ffffff22;border-radius:12px 12px 0 0;padding:8px;cursor:pointer}
.f{font-size:36px}.row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #ffffff1a;cursor:pointer}.row:hover{background:#ffffff11}
.g{color:#ffd700;font-weight:700;margin-left:auto;text-align:right}.s{font-size:12px;opacity:.7}.wb{display:inline-block;background:linear-gradient(90deg,#ffd700,#ff9a00);color:#1a0b2e;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}.dn{background:#ffffff14;border:1px solid #ffd70055;color:#ffe9a8;text-align:center;padding:6px 10px;border-radius:8px;font-size:12px;line-height:1.4;margin:6px 0}.dt{display:inline-block;background:#ffffff26;color:#ddd;font-size:10px;font-weight:700;letter-spacing:.5px;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}.pl{color:#ffd700;font-size:12px;margin-left:6px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs .off{background:#ffffff22;color:#fff}.top{background:linear-gradient(90deg,#ffd70044,transparent);border-radius:10px}
</style></head><body><div class="w">
<h1 id="t"></h1><div id="demo"></div><div id="dnote" class="dn" hidden>Some entries shown here are demo data used to illustrate how the ranking works, not real payments. Demo entries will be removed as real contributions come in.</div><div class="card" style="text-align:center"><div style="font-size:15px;line-height:1.5" id="hero"></div></div><div id="main"></div><footer style="text-align:center;font-size:12px;opacity:.8;padding:20px 0"><a style="color:#ffd700" href="/terms">Terms</a> · <a style="color:#ffd700" href="/privacy">Privacy</a> · <a style="color:#ffd700" href="/refund">Refund Policy</a><br><span id="ft"></span><br>© 2026 Richest Country</footer></div>
<script>let EM='';function heroT(){document.getElementById('hero').innerHTML='Push your country to #1! Pick a country and support this site from $'+MINV+' — your contribution counts toward its total.<br><span class=s>Contributions are voluntary. You receive no goods, services, or returns of any kind. This is not an investment, lottery, or gambling.</span>';document.getElementById('ft').textContent='Contact: '+(EM||'')}
const CODES="AF AX AL DZ AS AD AO AI AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BA BW BR IO BN BG BF BI KH CM CA CV KY CF TD CL CN CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FK FO FJ FI FR GF PF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT VA HN HK HU IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI KP KR XK KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU MK MP NO OM PK PW PS PA PG PY PE PH PN PL PT PR QA RE RO RU RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM TC TV UG UA AE GB US UY UZ VU VE VN VG VI WF EH YE ZM ZW".split(' ');
let MINV=2;let L='en',D={rows:[],recent:[]},view=location.hash.slice(1),DEMO=false;{const u=new URLSearchParams(location.search).get('c');if(u&&/^[A-Za-z]{2}$/.test(u)){view=u.toUpperCase();localStorage.pick=view;history.replaceState(null,'','/#'+view)}}
const rk=i=>i<3?`<span class="cr${i+1}" title="#${i+1}">👑</span>`:'#'+(i+1);
const T={en:{t:'👑 The Richest Country in the World',pick:'Pick a country',amt:'Amount (min $'+MINV+')',name:'Display name (optional)',msg:'Short message (optional, max 80)',share:'🔗 Share',go:'Support your country!',lb:'🏆 Leaderboard',search:'Search countries...',rec:'⚡ Recent',ppl:'donors',back:'← Back',donors:'👑 Top donors from this country',demo:'DEMO MODE — no real money is charged',none:'No one yet',ok:'Thank you!'}};
const nm=c=>new Intl.DisplayNames([L],{type:'region'}).of(c),fl=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt())),
$=n=>'$'+(n/100).toLocaleString(undefined,{minimumFractionDigits:2}),tm=t=>new Date(t).toLocaleString('en-US'),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';');let q='';
const WT='<span class="wb">🏆 World\'s Top Donor</span>',isTop=(c,n)=>D.top&&D.top.c==c&&D.top.name==n,
host=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.hostname.replace(/^www\./,''):''}catch(e){return ''}},
plink=u=>{const hn=u&&host(u);return hn?`<a class="pl" href="${esc(u)}" target="_blank" rel="nofollow noopener ugc" onclick="event.stopPropagation()">🔗 ${esc(hn)}</a>`:''},
who=(c,x)=>esc(x.name)+(x.demo?'<span class="dt">DEMO</span>':'')+(isTop(c,x.name)?WT:'')+plink(x.link);
async function load(){const fs=keep();D=await(await fetch('/api/leaderboard')).json();if(view=='hall'){const H=await(await fetch('/api/hall')).json();D.hall=H.hall;D.top=H.top}else if(view){const C=await(await fetch('/api/country/'+view)).json();D.donors=C.donors;D.top=C.top}render();restore(fs);checkOver()}
function go(c){location.hash=c||'';}onhashchange=()=>{view=location.hash.slice(1);load()};
function render(){const t=T[L];heroT();document.getElementById('t').textContent=t.t;document.getElementById('demo').innerHTML=DEMO?`<div class="demo">${t.demo}</div>`:'';
const r=D.rows,M=document.getElementById('main');
if(view=='hall'){const H=D.hall||[];M.innerHTML=`<button onclick="go()">${t.back}</button><div class="card"><h3>🏛️ Hall of Fame — Top 10 donors worldwide</h3>${H.map((x,i)=>`<div class="row ${i?'':'top'}" onclick="go('${x.c}')"><b>${rk(i)}</b><span class="f" style="font-size:24px">${fl(x.c)}</span><div>${who(x.c,x)}<div class="s">${nm(x.c)}</div>${x.msg?`<div class="s" style="opacity:.9;font-style:italic">“${esc(x.msg)}”</div>`:''}</div><div class="g">${$(x.cents)}</div></div>`).join('')||t.none}</div>`;return}
if(view){const d=D.donors||[],row=r.find(x=>x.c==view)||{cents:0,n:0};M.innerHTML=`<button onclick="go()">${t.back}</button>
<div class="card" style="text-align:center"><div class="f" style="font-size:64px">${fl(view)}</div><h2>${nm(view)}</h2><button style="width:auto;padding:8px 16px" onclick="share('${view}')">${t.share}</button><div class="g" style="margin:0;font-size:24px;text-align:center">${$(row.cents)}</div></div>
<div class="card"><h3>${t.donors}</h3>${d.map((x,i)=>`<div class="row ${i?'':'top'}"><b>${rk(i)}</b><div>${who(view,x)}${x.msg?`<div class="s" style="opacity:.9;font-style:italic">“${esc(x.msg)}”</div>`:''}<div class="s">${tm(x.t)} · ×${x.n}</div></div><div class="g">${$(x.cents)}</div></div>`).join('')||t.none}</div>`+form(view);return}
const p=[r[1],r[0],r[2]],h=[90,130,70],md=['🥈','🥇','🥉'];
M.innerHTML=`<div class="tabs"><button>${t.lb}</button><button class="off" onclick="go('hall')">🏛️ Hall of Fame</button></div>`+form()+`<div class="card"><h3>${t.lb}</h3><div class="pod">${p.map((x,i)=>x?`<div style="height:${h[i]+60}px" onclick="go('${x.c}')">${md[i]}<div class="f">${fl(x.c)}</div><div class="s">${nm(x.c)}</div><b>${$(x.cents)}</b></div>`:'<div style="opacity:0"></div>').join('')}</div>
<input placeholder="${t.search}" value="${q}" oninput="q=this.value;list()"><div id="list"></div></div>
<div class="card"><h3>${t.rec}</h3>${D.recent.map(x=>`<div class="row" onclick="go('${x.c}')">${fl(x.c)} <div>${who(x.c,x)}${x.msg?`<div class="s" style="opacity:.9;font-style:italic">“${esc(x.msg)}”</div>`:''}<div class="s">${tm(x.t)}</div></div><div class="g">+${$(x.cents)}</div></div>`).join('')||t.none}</div>`;list()}
function list(){const t=T[L],e=document.getElementById('list');if(!e)return;e.innerHTML=D.rows.map((x,i)=>[x,i]).filter(([x])=>nm(x.c).toLowerCase().includes(q.toLowerCase())||x.c.includes(q.toUpperCase()))
.map(([x,i])=>`<div class="row" onclick="go('${x.c}')"><b>#${i+1}</b><span class="f" style="font-size:24px">${fl(x.c)}</span><div>${nm(x.c)}<div class="s">${x.n} ${t.ppl}</div></div><div class="g">${$(x.cents)}</div><button title="Share" style="width:auto;padding:6px 10px;margin-left:6px" onclick="event.stopPropagation();share('${x.c}')">🔗</button></div>`).join('')||t.none}
function form(sel){const t=T[L],o=CODES.map(c=>[c,nm(c)]).sort((a,b)=>a[1].localeCompare(b[1],L));sel=sel||localStorage.pick||localStorage.c||'US';
return `<div class="card"><select id="c" onchange="hint()">${o.map(([c,n])=>`<option value="${c}" ${c==sel?'selected':''}>${fl(c)} ${n}</option>`).join('')}</select>
<input id="a" type="number" min="${MINV}" step="1" value="${MINV}" placeholder="${t.amt}" oninput="hint()"><input id="n" maxlength="30" placeholder="${t.name}" oninput="hint()"><input id="m" maxlength="80" placeholder="${t.msg}"><input id="l" type="url" maxlength="200" placeholder="Profile link (optional, unlocks at $20+)" oninput="hint()"><div id="lh" class="s"></div><div id="hint" class="s" style="opacity:.95;line-height:1.5;margin:4px 0"></div><button onclick="pay()">${t.go}</button></div>`}
async function pay(){const c=document.getElementById('c').value,a=+document.getElementById('a').value;if(!(a>=MINV))return alert(T[L].amt);const lv=document.getElementById('l').value.trim();if(lv&&a>=20&&!host(lv))return alert('Profile link must start with http:// or https://');localStorage.c=c;
const r=await(await fetch('/api/contribute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country:c,amount:a,name:document.getElementById('n').value,message:document.getElementById('m').value,link:document.getElementById('l').value})})).json();
if(r.url||r.demo){localStorage.me=JSON.stringify({c,name:document.getElementById('n').value.trim()||'Anonymous'});localStorage.removeItem('last')}
if(r.url)location=r.url;else if(r.error)alert(r.error);else{alert(T[L].ok);load()}}
fetch('/api/config').then(r=>r.json()).then(c=>{DEMO=c.demo;document.getElementById('dnote').hidden=!c.demoNotice;MINV=c.min;EM=c.email;render();load()});setInterval(load,5000);

function keep(){const g=i=>document.getElementById(i);return g('c')?{c:g('c').value,a:g('a').value,n:g('n').value,m:g('m').value,l:g('l').value,f:document.activeElement&&document.activeElement.id}:null}
function restore(s){const g=i=>document.getElementById(i);if(s&&g('c')){if(!view)g('c').value=s.c;g('a').value=s.a;g('n').value=s.n;g('m').value=s.m;g('l').value=s.l||'';if(s.f&&g(s.f))g(s.f).focus()}hint()}
async function share(c){const url=location.origin+'/?c='+c,text='Help push '+nm(c)+' to #1 Richest Country!';
 if(navigator.share){try{await navigator.share({title:'The Richest Country in the World',text,url});return}catch(e){if(e.name=='AbortError')return}}
 try{await navigator.clipboard.writeText(text+' '+url);alert('Link copied! '+url)}catch(e){prompt('Copy this link:',text+' '+url)}}
const DC={};async function donorsOf(c){if(view==c&&D.donors)return D.donors;const k=c+':'+D.rows.reduce((s,x)=>s+x.cents,0);if(!DC[k])DC[k]=(await(await fetch('/api/country/'+c)).json()).donors;return DC[k]}
async function hint(){const g=i=>document.getElementById(i),e=g('hint');if(!e||!g('c'))return;const c=g('c').value,a=Math.round((+g('a').value||0)*100),name=g('n').value.trim()||'Anonymous',r=D.rows;
 const lh=g('lh');if(lh)lh.textContent=a<2000?'🔒 Profile link unlocks at $20+ (single payment) — it will be ignored below $20.':'';const i=r.findIndex(x=>x.c==c),mine=i<0?0:r[i].cents,lead=r[0];let h;
 if(lead&&lead.c==c){const gap=mine-(r[1]?r[1].cents:0);h=`🥇 ${nm(c)} is #1 — pay ${$(Math.max(a,MINV*100))} to extend the lead (currently ${$(gap)} ahead)`}
 else{const need=Math.max(MINV*100,(lead?lead.cents:0)-mine+1);h=`🚀 Pay ${$(need)} more to put ${nm(c)} at #1`+(a>=need?' — your amount does it!':'')}
 const d=await donorsOf(c);if(g('c').value!=c)return;const top=d[0],me=d.find(x=>x.name==name),have=me?me.cents:0;let h2;
 if(top&&top.name==name)h2=`👑 You are the top donor of ${nm(c)}!`;else{const need2=Math.max(MINV*100,(top?top.cents:0)-have+1);h2=`Pay ${$(need2)} to become the top donor 👑 of ${nm(c)}`+(a>=need2?' — your amount does it!':'')}
 e.innerHTML=esc(h)+'<br>'+esc(h2)}
let OVR=0;async function checkOver(){if(OVR)return;let me;try{me=JSON.parse(localStorage.me||'null')}catch(e){}if(!me||!D.rows.length)return;OVR=1;
 const rank=D.rows.findIndex(x=>x.c==me.c)+1,d=await donorsOf(me.c),top=d[0]?d[0].name:null,last=JSON.parse(localStorage.last||'null');
 if(!rank){OVR=0;return}const msgs=[];
 if(last){if(last.rank&&rank>last.rank){const by=D.rows[rank-2];msgs.push(`⚠️ ${nm(me.c)} dropped from #${last.rank} to #${rank}`+(by?` — overtaken by ${fl(by.c)} ${nm(by.c)}`:'')+'!')}
  if(last.top==me.name&&top&&top!=me.name)msgs.push(`👑 ${top} overtook you as top donor of ${nm(me.c)}!`)}
 localStorage.last=JSON.stringify({rank,top});
 if(msgs.length){const b=document.createElement('div');b.className='demo';b.style.cssText='background:#ff9a00;color:#1a0b2e;font-weight:700;margin:8px 0;font-size:14px;cursor:pointer';
  b.innerHTML=msgs.map(esc).join('<br>')+'<br><u>Take it back →</u> <span style="float:right" onclick="event.stopPropagation();this.parentNode.remove()">✕</span>';b.onclick=()=>{b.remove();go(me.c)};document.getElementById('demo').after(b)}}
</script></body></html>
